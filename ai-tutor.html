<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Tutor – AlphaX</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <header class="nav">
    <a href="dashboard.html" class="brand">Alpha<span>X</span></a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="upload.html">Upload Notes</a>
      <a href="my-notes.html">My Notes</a>
      <a href="ai-tutor.html" class="active">AI Tutor</a>
      <div class="nav-user">
        <span class="badge" id="syncBadge">Checking...</span>
        <span class="user-pill" id="navUserName">Student</span>
        <a href="#" id="logoutBtn" class="btn sm secondary">Logout</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <h2>AI Tutor</h2>
      <p class="status">Select a saved note or enter your own text, then ask for an explanation, summary, questions, or a follow-up.</p>
      <label for="noteSelect">Use a saved note</label>
      <select id="noteSelect">
        <option value="">Choose a note (optional)</option>
      </select>
      <label for="noteText">Study text</label>
      <textarea id="noteText" maxlength="20000" placeholder="Paste or type your notes here..."></textarea>
      <div class="tutor-actions">
        <button type="button" class="btn" data-action="explain">Explain simply</button>
        <button type="button" class="btn soft" data-action="summary">Create summary</button>
        <button type="button" class="btn soft" data-action="questions">Generate questions</button>
      </div>
      <label for="question">Ask a follow-up question</label>
      <div class="row-inline">
        <input type="text" id="question" maxlength="2000" placeholder="e.g. Why does this process matter?" />
        <button type="button" class="btn" id="askBtn">Ask tutor</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
    <div class="card">
      <h3>Study response</h3>
      <div id="answer" class="ai-output" aria-live="polite">Your AI response will appear here.</div>
    </div>
  </main>
  <script type="module" src="js/tutor.js"></script>
</body>
</html>
